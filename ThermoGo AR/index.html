<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS Safari: allow fullscreen camera, hide browser chrome -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ThermoGo AR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
    }

    /* ── Force the A-Frame canvas to fill screen ── */
    a-scene {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 1;
    }
    /* MindAR injects a <video> and a <canvas> — both must be full-screen */
    a-scene canvas,
    #mindar-video-container,
    #mindar-video-container video {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    /* ── Tap-to-Start overlay ── */
    #start-screen {
      position: fixed; inset: 0;
      background: #000D1A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2000;
      transition: opacity 0.6s ease;
    }
    #start-screen.hidden { opacity: 0; pointer-events: none; }

    .ss-logo {
      font-size: 42px; font-weight: 900;
      color: #00BCD4; letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 0 30px rgba(0,188,212,0.6);
    }
    .ss-tagline {
      font-size: 12px; color: #80DEEA;
      letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 52px;
    }
    .ss-icon {
      font-size: 52px; margin-bottom: 24px;
      animation: float 2.4s ease-in-out infinite;
    }
    #start-btn {
      background: linear-gradient(135deg, #006064, #00BCD4);
      color: #fff; border: none; border-radius: 50px;
      padding: 16px 42px;
      font-size: 16px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(0,188,212,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:active  { transform: scale(0.96); box-shadow: 0 0 14px rgba(0,188,212,0.3); }
    #start-btn:disabled {
      background: linear-gradient(135deg, #1a3a3a, #2a5a5a);
      opacity: 0.6; cursor: not-allowed; box-shadow: none;
      animation: disabled-pulse 1.4s ease-in-out infinite;
    }
    @keyframes disabled-pulse {
      0%,100% { opacity: 0.5; } 50% { opacity: 0.75; }
    }
    .ss-note {
      margin-top: 18px; font-size: 11px;
      color: rgba(128,222,234,0.55); letter-spacing: 0.5px;
      text-align: center; max-width: 260px; line-height: 1.6;
    }

    /* ── Loading indicator (shown after tap while camera warms up) ── */
    #loading-bar-wrap {
      position: fixed; top: 0; left: 0; right: 0;
      height: 3px; z-index: 1500;
      display: none;
    }
    #loading-bar-wrap.visible { display: block; }
    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #006064, #00BCD4, #40C4FF);
      animation: bar-fill 4s ease-in-out forwards;
    }

    /* ── Corner Badge ── */
    #corner-badge {
      position: fixed; top: 18px; left: 18px;
      background: rgba(0,18,30,0.80);
      border: 1px solid rgba(0,188,212,0.35);
      border-radius: 12px; padding: 8px 14px;
      backdrop-filter: blur(12px);
      pointer-events: none; z-index: 100;
      opacity: 0; transition: opacity 0.5s ease;
    }
    #corner-badge.visible { opacity: 1; }
    .cb-name { font-size: 13px; font-weight: 700; color: #00BCD4; }
    .cb-dot  {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: #1DE9B6;
      margin-right: 5px;
      animation: blink 1.4s ease-in-out infinite;
    }
    .cb-live { font-size: 10px; color: #80DEEA; }

    /* ── Scan Hint ── */
    #scan-hint {
      position: fixed; bottom: 44px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,188,212,0.88);
      color: #fff; padding: 11px 22px;
      border-radius: 24px; font-size: 13px; font-weight: 600;
      letter-spacing: 0.4px; pointer-events: none; z-index: 100;
      white-space: nowrap;
      display: none;
      animation: hint-pulse 2.2s ease-in-out infinite;
    }
    #scan-hint.visible { display: block; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    @keyframes bar-fill {
      0%   { width: 0%; }
      50%  { width: 70%; }
      85%  { width: 92%; }
      100% { width: 100%; }
    }
    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    @keyframes hint-pulse {
      0%,100% { transform: translateX(-50%) scale(1); opacity: 1; }
      50%      { transform: translateX(-50%) scale(0.97); opacity: 0.75; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════
     TAP-TO-START  (required by iOS/Android
     to grant camera access)
════════════════════════════════════════ -->
<div id="start-screen">
  <div class="ss-logo">ThermoGo</div>
  <div class="ss-tagline">Smart Monitoring · Safe Medicines</div>
  <div class="ss-icon">📷</div>
  <button id="start-btn" onclick="startAR()" disabled>Preparing AR…</button>
  <p class="ss-note" id="ss-note">Initialising — please wait a moment…</p>
  <p id="safari-hint" style="display:none; margin-top:14px; font-size:11px;
     color:#FF8A65; max-width:270px; text-align:center; line-height:1.7;">
    ⚠️ Must be opened in <strong>Safari</strong> on iPhone.<br>
    Copy the URL and paste it into Safari if you arrived from another app.
  </p>
</div>

<!-- Progress bar (visible while camera warms up) -->
<div id="loading-bar-wrap"><div id="loading-bar"></div></div>

<!-- Error display -->
<div id="error-box" style="display:none; position:fixed; bottom:80px; left:50%;
     transform:translateX(-50%); background:rgba(180,30,30,0.92);
     color:#fff; padding:12px 20px; border-radius:12px; font-size:12px;
     max-width:300px; text-align:center; z-index:500; line-height:1.6;">
</div>

<!-- ════════════════════════════════════════
     HUD
════════════════════════════════════════ -->
<div id="corner-badge">
  <div class="cb-name">ThermoGo AR</div>
  <div class="cb-live"><span class="cb-dot"></span>Live Experience</div>
</div>
<div id="scan-hint">📷 Point camera at the ThermoGo poster</div>

<!-- ════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════ -->
<script>
const scene       = document.querySelector('a-scene');
const startScreen = document.getElementById('start-screen');
const startBtn    = document.getElementById('start-btn');
const ssNote      = document.getElementById('ss-note');
const safariHint  = document.getElementById('safari-hint');
const loadingBar  = document.getElementById('loading-bar-wrap');
const hint        = document.getElementById('scan-hint');
const badge       = document.getElementById('corner-badge');
const errorBox    = document.getElementById('error-box');

// ── Show error message on screen ───────────────────────
function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

// ── Detect non-Safari iOS browsers (they block camera) ─
function isIOSNonSafari() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  // Safari on iOS contains "Safari" but not "CriOS", "FxiOS", "OPiOS"
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|OPiOS|EdgiOS/.test(ua);
  return isIOS && !isSafari;
}

// ── Patch any video MindAR injects — iOS needs playsinline ─
new MutationObserver((mutations) => {
  mutations.forEach(({ addedNodes }) => {
    addedNodes.forEach((node) => {
      if (node.nodeName === 'VIDEO') {
        node.setAttribute('playsinline', '');
        node.setAttribute('webkit-playsinline', '');
        node.muted      = true;
        node.playsInline = true;
      }
    });
  });
}).observe(document.body, { childList: true, subtree: true });

// ── Wait for scene to load BEFORE enabling the button ──
// This guarantees the button tap is always synchronous with
// mindar.start() — the pattern iOS requires for camera access.
scene.addEventListener('loaded', () => {
  if (isIOSNonSafari()) {
    safariHint.style.display = 'block';
    ssNote.textContent = 'Camera requires Safari on iPhone.';
    return; // button stays disabled — user must switch browser
  }
  startBtn.disabled    = false;
  startBtn.textContent = 'Launch AR Experience';
  ssNote.textContent   = 'Allow camera access when prompted.';
}, { once: true });

// ── Start AR — always called after scene is loaded ─────
function startAR() {
  startScreen.classList.add('hidden');
  setTimeout(() => startScreen.remove(), 700);
  loadingBar.classList.add('visible');

  // mindar-image-system is guaranteed to exist here (scene already loaded)
  const mindar = scene.systems['mindar-image-system'];
  if (!mindar) {
    showError('AR system not found. Please reload the page.');
    return;
  }

  // start() is called synchronously inside the click handler — iOS allows camera
  mindar.start().catch((err) => {
    console.error('MindAR start error:', err);
    if (err.name === 'NotAllowedError') {
      showError('Camera access was denied. Go to Settings → Safari → Camera and allow this site, then reload.');
    } else if (err.name === 'NotFoundError') {
      showError('No camera found on this device.');
    } else {
      showError('Camera error: ' + err.message + '. Try reloading in Safari.');
    }
    loadingBar.classList.remove('visible');
  });

  setTimeout(() => {
    loadingBar.classList.remove('visible');
    hint.classList.add('visible');
  }, 3500);
}

// ── Target found / lost ─────────────────────────────────
scene.addEventListener('targetFound', () => {
  hint.classList.remove('visible');
  badge.classList.add('visible');
  spawnParticles();
});
scene.addEventListener('targetLost', () => {
  hint.classList.add('visible');
  badge.classList.remove('visible');
});

// ── Live sensor simulation ──────────────────────────────
const BASE_TEMP = 23.4;
const BASE_HUM  = 48;
let tick = 0;

function refreshReadings() {
  tick++;
  const temp = parseFloat(
    (BASE_TEMP + Math.sin(tick * 0.28) * 0.9 + (Math.random() - 0.5) * 0.15).toFixed(1)
  );
  const hum = Math.round(BASE_HUM + Math.cos(tick * 0.21) * 3 + (Math.random() - 0.5));
  const safe = temp >= 15 && temp <= 25 && hum >= 30 && hum <= 60;

  const tEl = document.getElementById('temp-val');
  const hEl = document.getElementById('hum-val');
  const sEl = document.getElementById('status-txt');
  const sBg = document.getElementById('status-bg');
  const dT  = document.getElementById('dev-temp');
  const dH  = document.getElementById('dev-hum');
  const led = document.getElementById('led');

  if (tEl) tEl.setAttribute('value', `${temp}°C`);
  if (hEl) hEl.setAttribute('value', `${hum}% RH`);
  if (dT)  dT.setAttribute('value',  `${temp}C`);
  if (dH)  dH.setAttribute('value',  `${hum}%`);

  if (safe) {
    if (tEl) tEl.setAttribute('color', '#00FF7F');
    if (sEl) { sEl.setAttribute('value', '✓  SAFE');  sEl.setAttribute('color', '#A5D6A7'); }
    if (sBg) sBg.setAttribute('material', 'color: #00695C; opacity: 0.95; side: double');
    if (led) led.setAttribute('material', 'color: #00FF7F; emissive: #00FF7F; emissiveIntensity: 1');
  } else {
    if (tEl) tEl.setAttribute('color', '#FF5252');
    if (sEl) { sEl.setAttribute('value', '⚠  ALERT'); sEl.setAttribute('color', '#EF9A9A'); }
    if (sBg) sBg.setAttribute('material', 'color: #7F1919; opacity: 0.95; side: double');
    if (led) led.setAttribute('material', 'color: #FF5252; emissive: #FF5252; emissiveIntensity: 1');
  }
}
setInterval(refreshReadings, 2200);

// ── Floating particles ──────────────────────────────────
let particlesSpawned = false;
function spawnParticles() {
  if (particlesSpawned) return;
  particlesSpawned = true;
  const container = document.getElementById('particles');
  if (!container) return;
  const palette = ['#00BCD4', '#1DE9B6', '#40C4FF', '#80DEEA', '#B2EBF2'];
  for (let i = 0; i < 10; i++) {
    const dot   = document.createElement('a-sphere');
    const ox    = (Math.random() - 0.5) * 0.35;
    const oy    = (Math.random() - 0.5) * 0.45;
    const color = palette[Math.floor(Math.random() * palette.length)];
    const delay = Math.random() * 3500;
    const dur   = 2200 + Math.random() * 1600;
    dot.setAttribute('radius', (0.006 + Math.random() * 0.005).toFixed(3));
    dot.setAttribute('position', `${ox} ${oy} 0`);
    dot.setAttribute('material',
      `color: ${color}; emissive: ${color}; emissiveIntensity: 0.85; opacity: 0.75; transparent: true`);
    dot.setAttribute('animation__rise',
      `property: position; from: ${ox} ${oy} 0; to: ${ox} ${oy + 0.6} 0;
       dur: ${dur}; delay: ${delay}; loop: true; easing: linear`);
    dot.setAttribute('animation__fade',
      `property: material.opacity; from: 0.75; to: 0;
       dur: ${dur}; delay: ${delay}; loop: true; easing: linear`);
    container.appendChild(dot);
  }
}
</script>
